[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# One public address for search engines: send the Netlify subdomain to the
# custom domain. Deploy previews (deploy-preview-N--mizan-website.netlify.app)
# are a different host, so they're unaffected.
[[redirects]]
  from = "https://mizan-website.netlify.app/*"
  to = "https://mizanexperience.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
